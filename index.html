<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Monitor</title>
<style>
:root {
  color-scheme: light;
  --bg: #f3f3f1; --surface: #fcfcfb; --surface-2: #f0efec; --line: #e2e1dc; --grid: #ebeae6;
  --text: #0b0b0b; --text-2: #52514e; --muted: #85847e;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --other: #a3a29c;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --accent: #2a78d6; --accent-wash: rgba(42,120,214,.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --line: #2c2c29; --grid: #262624;
    --text: #ffffff; --text-2: #c3c2b7; --muted: #8d8c85;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --other: #6d6c67;
    --accent: #3987e5; --accent-wash: rgba(57,135,229,.16);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --line: #2c2c29; --grid: #262624;
  --text: #ffffff; --text-2: #c3c2b7; --muted: #8d8c85;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --other: #6d6c67;
  --accent: #3987e5; --accent-wash: rgba(57,135,229,.16);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13.5px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
       -webkit-font-smoothing: antialiased; }
.app { display: grid; grid-template-columns: 208px 1fr; min-height: 100vh; }
nav { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 10px; position: sticky; top: 0; height: 100vh;
      display: flex; flex-direction: column; gap: 2px; }
.brand { display: flex; align-items: center; gap: 9px; padding: 0 10px 18px; font-weight: 650; font-size: 15px; }
.brand svg { flex: none; }
nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; color: var(--text-2);
        text-decoration: none; font-weight: 500; }
nav a:hover { background: var(--surface-2); color: var(--text); }
nav a.on { background: var(--accent-wash); color: var(--text); }
nav a svg { width: 16px; height: 16px; flex: none; }
nav a .badge { margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums; color: var(--text-2);
               background: var(--surface-2); border-radius: 999px; padding: 0 7px; }
nav { overflow-y: auto; }
.side { margin: 14px 4px 0; padding-top: 14px; border-top: 1px solid var(--line); display: grid; gap: 16px; }
.side h5 { margin: 0 0 7px; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
           display: flex; justify-content: space-between; align-items: baseline; }
.side h5 span { text-transform: none; letter-spacing: 0; font-weight: 500; }
.sq { margin-bottom: 8px; }
.sq .r { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-2); }
.sq .r b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
.sq .track { height: 5px; margin: 4px 0 2px; }
.sq .sub { font-size: 10.5px; }
.sbad { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); margin-top: 4px; }
.sbad i { width: 6px; height: 6px; border-radius: 50%; background: var(--critical); flex: none; }
.sbig { display: flex; align-items: baseline; gap: 6px; }
.sbig b { font-size: 20px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.sbig span { font-size: 11px; color: var(--muted); }
.srun { display: grid; gap: 2px; }
.srun a { display: grid; grid-template-columns: 8px 1fr auto; gap: 7px; align-items: center; padding: 4px 6px; margin: 0 -6px;
          border-radius: 6px; color: var(--text-2); font-size: 11.5px; font-weight: 400; text-decoration: none; }
.srun a:hover { background: var(--surface-2); color: var(--text); }
.srun a .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srun a .t small { display: block; color: var(--muted); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; }
.srun a .e { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.srun .d { width: 7px; height: 7px; border-radius: 50%; }
.ssrc { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; margin-bottom: 6px; }
.slg { display: grid; gap: 3px; font-size: 11px; color: var(--text-2); }
.slg div { display: flex; justify-content: space-between; }
.slg i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: -.5px; }
.slg b { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text); }
nav .foot { margin-top: auto; padding: 10px; font-size: 11.5px; color: var(--muted); display: grid; gap: 6px; }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.live-dot.pulse { animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(12,163,12,.55); } 70% { box-shadow: 0 0 0 7px rgba(12,163,12,0); } 100% { box-shadow: 0 0 0 0 rgba(12,163,12,0); } }
.live-dot.stale { background: var(--critical); animation: none; }
main { padding: 18px 26px 48px; min-width: 0; }
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.top h1 { font-size: 20px; margin: 0 12px 0 0; font-weight: 650; letter-spacing: -.01em; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; color: var(--text-2); font: inherit; font-size: 12.5px; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
.seg button.on { background: var(--surface-2); color: var(--text); font-weight: 600; }
.ctl { font: inherit; font-size: 12.5px; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
button.ctl { cursor: pointer; }
button.ctl:hover { border-color: var(--muted); }
.custom { display: none; gap: 6px; align-items: center; }
.custom.show { display: inline-flex; }
.filters { display: none; align-items: center; gap: 8px; flex-wrap: wrap; margin: -6px 0 16px; }
.filters.show { display: flex; }
.filters .search { position: relative; }
.filters .search input { padding-left: 26px; width: 220px; }
.filters .search svg { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; color: var(--muted); pointer-events: none; }
.filters select.active, .filters input.active { border-color: var(--accent); background: var(--accent-wash); }
.filters .count { font-size: 12px; color: var(--muted); }
.filters .clear { display: none; }
.filters .clear.show { display: inline-block; }
.top .meta { margin-left: auto; color: var(--muted); font-size: 12px; }
.grid { display: grid; gap: 14px; }
.g-kpi { grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); }
.g2 { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.span2 { grid-column: 1 / -1; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.card-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.card-h h3 { margin: 0; font-size: 13.5px; font-weight: 620; }
.card-h .sub { font-size: 12px; }
.card-h .tools { margin-left: auto; display: flex; gap: 6px; }
.link { border: 0; background: none; color: var(--text-2); font: inherit; font-size: 12px; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.sub { color: var(--muted); }
.kpi .label { color: var(--text-2); font-size: 12px; }
.kpi .value { font-size: 24px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .hint { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
section.page { display: none; }
section.page.on { display: block; }
.stack > * + * { margin-top: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.line { height: 2px; border-radius: 1px; vertical-align: 3px; width: 14px; }
svg.chart { display: block; width: 100%; overflow: visible; }
svg.chart text { fill: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
svg.chart .gridline { stroke: var(--grid); stroke-width: 1; }
svg.chart .axis { stroke: var(--line); }
svg.chart .hit { fill: transparent; cursor: default; }
svg.chart .hover-band { fill: var(--text); opacity: .05; }
.updating { opacity: .55; transition: opacity .2s; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
       box-shadow: 0 6px 22px rgba(0,0,0,.14); padding: 8px 10px; font-size: 12px; min-width: 150px; display: none; }
.tip .t { color: var(--text-2); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .r b { font-variant-numeric: tabular-nums; }
.tip .r span { color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
.tip .r span i { display: inline-block; width: 12px; height: 2px; border-radius: 1px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.scroll { overflow-x: auto; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
.status svg { width: 12px; height: 12px; flex: none; }
.gauge { margin: 10px 0 4px; }
.gauge .row { display: flex; justify-content: space-between; font-size: 12.5px; }
.gauge .row b { font-variant-numeric: tabular-nums; }
.track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin: 5px 0 3px; }
.fill { height: 100%; border-radius: 4px; transition: width .6s ease; }
.acct { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 5px 0; border-top: 1px solid var(--line); }
.tree { display: grid; gap: 10px; }
.node { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.node.root { border-left: 3px solid var(--accent); }
.node .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.node .title { font-weight: 600; }
.node .meta { color: var(--muted); font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; margin-top: 3px; }
.node .meta b { color: var(--text-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.node .act { color: var(--text-2); font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.children { margin: 8px 0 0 12px; padding-left: 12px; border-left: 1px dashed var(--line); display: grid; gap: 6px; }
.child { padding: 6px 0; }
.flash { animation: flash 1s ease-out; }
@keyframes flash { from { color: var(--good); } to { color: inherit; } }
.chip { font-size: 11px; color: var(--text-2); background: var(--surface-2); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.cols { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.col h4 { margin: 0 0 8px; font-size: 12.5px; display: flex; justify-content: space-between; align-items: center; }
.kcard { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 12.5px; }
.kcard .sub { font-size: 11.5px; margin-top: 2px; }
.err { color: var(--critical); font-size: 12px; }
.empty { color: var(--muted); padding: 14px 0; font-size: 13px; }
.note { font-size: 12px; color: var(--muted); margin-top: 6px; }
.spark { display: block; }
/* click-to-open rows: same look, plus hover/focus feedback and an "open" hint */
.clickable { cursor: pointer; }
.clickable:hover { background: var(--surface-2); }
.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.orow { border-radius: 8px; padding: 4px 6px; margin: -4px -6px; }
.go { margin-left: auto; font-size: 11.5px; color: var(--text-2); white-space: nowrap; }
.clickable:hover .go, .clickable:focus-visible .go { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.orow.appr, .jobrow.appr { background: color-mix(in srgb, var(--serious) 14%, transparent); box-shadow: inset 3px 0 0 var(--serious); }
.orow.appr:hover, .jobrow.appr:hover { background: color-mix(in srgb, var(--serious) 22%, transparent); }
.node.appr { border-color: var(--serious); }
.status.appr { color: var(--text); font-weight: 650; }
.banner { border: 1px solid var(--serious); border-radius: 12px; padding: 10px 14px; background: color-mix(in srgb, var(--serious) 10%, var(--surface)); }
.banner h3 { margin: 0 0 6px; font-size: 13.5px; }
.jobs { display: grid; gap: 2px; }
.jobrow { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; min-width: 0; }
.jobrow .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.jobrow .who { color: var(--muted); font-size: 12px; white-space: nowrap; }
.kcard.clickable:hover { border-color: var(--muted); background: var(--surface-2); }
.kcard .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 60; max-width: min(560px, calc(100vw - 24px));
         background: var(--text); color: var(--bg); border-radius: 10px; padding: 9px 14px; font-size: 12.5px; box-shadow: 0 6px 22px rgba(0,0,0,.25);
         opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }
nav a .badge.warn { background: var(--serious); color: #000; font-weight: 650; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .jobrow { flex-wrap: wrap; }
  nav { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 8px; }
  .brand, nav .foot, .side { display: none; }
  nav a { white-space: nowrap; }
  main { padding: 14px 16px 40px; }
  .g2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <nav id="nav">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
      Agent Monitor
    </div>
  </nav>
  <main>
    <div class="top">
      <h1 id="title">Canlı</h1>
      <div class="seg" id="ranges"></div>
      <span class="custom" id="custom">
        <input type="date" class="ctl" id="from"> – <input type="date" class="ctl" id="to">
      </span>
      <select class="ctl" id="profile"><option value="">Tüm profiller</option></select>
      <span class="meta" id="meta"></span>
    </div>
    <div class="filters" id="filters">
      <span class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="ctl" id="f-q" type="search" placeholder="Ara…"></span>
      <select class="ctl" id="f-source"></select>
      <select class="ctl" id="f-provider"></select>
      <select class="ctl" id="f-model"></select>
      <select class="ctl" id="f-status"></select>
      <button class="ctl clear" id="f-clear">Temizle</button>
      <span class="count" id="f-count"></span>
    </div>
    <section class="page" id="p-live"></section>
    <section class="page" id="p-overview"></section>
    <section class="page" id="p-accounts"></section>
    <section class="page" id="p-agents"></section>
    <section class="page" id="p-subagents"></section>
    <section class="page" id="p-clis"></section>
    <section class="page" id="p-kanban"></section>
  </main>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
// ---------- utilities ----------
const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, ...kids) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) el.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid) el.append(kid);
  return el;
}
const nfc = new Intl.NumberFormat('tr-TR', { notation: 'compact', maximumFractionDigits: 1 });
const nfi = new Intl.NumberFormat('tr-TR');
const fmtN = v => nfc.format(v || 0);
const fmtUsd = v => '$' + (v || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtPct = v => v == null ? '—' : '%' + Math.round(v);
const dayLabel = d => new Date(d + 'T00:00').toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
const timeLabel = t => new Date(t * 1000).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
function ago(t) {
  if (!t) return '—';
  const x = Date.now() / 1000 - t;
  if (x < 5) return 'şimdi';
  if (x < 60) return Math.floor(x) + ' sn önce';
  if (x < 3600) return Math.floor(x / 60) + ' dk önce';
  if (x < 86400) return Math.floor(x / 3600) + ' sa önce';
  return Math.floor(x / 86400) + ' gün önce';
}
function dur(sec) {
  if (sec == null) return '—';
  sec = Math.max(0, Math.floor(sec));
  if (sec < 60) return sec + ' sn';
  if (sec < 3600) return Math.floor(sec / 60) + ' dk ' + (sec % 60) + ' sn';
  return Math.floor(sec / 3600) + ' sa ' + Math.floor((sec % 3600) / 60) + ' dk';
}
function until(t) {
  if (!t) return '';
  const x = t - Date.now() / 1000;
  if (x <= 0) return 'sıfırlandı';
  return dur(x).replace(/ \d+ sn$/, '') + ' sonra sıfırlanır';
}
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('hm:' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('hm:' + k, JSON.stringify(v)); } catch {} },
};

// ---------- strings (Turkish UI texts used by the open / state features) ----------
const T = {
  open: 'Aç ↗', copy: 'Komutu kopyala', openCard: 'Panoyu aç + komutu kopyala', nothing: 'Bu satır için açılacak bir yer yok.',
  opening: label => `Açılıyor: ${label}`,
  copied: cmd => `Komut kopyalandı — Terminal'de çalıştır: ${cmd}`,
  copyFailed: cmd => `Kopyalanamadı. Komut: ${cmd}`,
  cardNoRoute: (copied, cmd) => 'Karta özel bağlantı yok: Hermes panosu açıldı' + (copied ? `, kart komutu kopyalandı: ${cmd}` : ''),
  openingWorker: id => `${id} kartının işçi oturumu açılıyor`,
  copiedRunning: cmd => `Bu oturum zaten çalışıyor; tarayıcı pencereyi öne getiremez, ikinci kez devam ettirme. Komut kopyalandı: ${cmd}`,
  openWorker: 'İşçi oturumunu aç ↗',
  tipOpen: 'Tıkla: aç · Shift+tık: komutu kopyala', tipCopy: 'Tıkla: komutu kopyala',
  noOpen: 'Şu an açık iş yok.',
  approvalTitle: n => `${n} iş onay bekliyor`, approvalHint: 'satıra tıklayınca ilgili oturum açılır',
};
const ORIGIN_NAME = { desktop: 'masaüstü', cli: 'CLI', tui: 'TUI', kanban: 'kanban işçisi', telegram: 'Telegram', slack: 'Slack', cron: 'zamanlanmış', 'claude-code': null, 'copilot-cli': null };
const originName = o => o in ORIGIN_NAME ? ORIGIN_NAME[o] : o;

// ---------- open action: url when the server verified a scheme, else copy the command ----------
let toastTimer = null;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 4500);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch {}
  const ta = h('textarea', { style: 'position:fixed;opacity:0;left:-999px' }); ta.value = t; document.body.append(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch {}
  ta.remove(); return ok;
}

  : it.unavailable_code === 'usage_unreadable'
  ? `Kullanım okunamıyor${it.unavailable_http ? ' (HTTP ' + it.unavailable_http + ')' : ''} — kimlik bilgisinin izni yetmiyor ya da sağlayıcı yanıt vermiyor.` : it.unavailable;
/** "Son değer, 5 dk önce · hız sınırı": the windows shown are the last good reading, not a fresh one. */
const staleText = it => `Son değer, ${ago(it.fetched_at)} · ${it.unavailable_code === 'rate_limited' ? 'hız sınırı' : 'kullanım şu an okunamıyor'}`
  + (retryText(it) ? ' · ' + retryText(it) : '');
const unverifiedWhy = a => `Bu kimlik bilgisinin hangi hesaba ait olduğu okunamadı${a.http ? ' (HTTP ' + a.http + ')' : ''}; aynı hesap olup olmadığı bilinmiyor.`;

function quotaCard(it, burn = []) {
  const kids = [];
  if (it.stale) kids.push(h('div', { class: 'note', style: 'margin:0;color:var(--warn)', title: unavailText(it) }, staleText(it)));
  it.windows.forEach(w => {
    kids.push(gauge({ ...w, stale: it.stale }, (it.local || {})[w.label]));
    const b = burn.find(x => x.provider === it.provider && x.window === w.label);
    if (b && b.per_hour > 0.01 && !it.stale) kids.push(h('div', { class: 'note', style: 'margin-top:0' },
      `Saatte +%${b.per_hour.toFixed(1)}` + (b.eta_full ? ` · bu hızla ${new Date(b.eta_full * 1000).toLocaleString('tr-TR', { weekday: 'short', hour: '2-digit', minute: '2-digit' })} dolar` : '')));
  });
  it.details.forEach(d => kids.push(h('div', { class: 'note' }, d)));
  if (it.unavailable && !it.stale) kids.push(h('div', { class: 'note' }, unavailText(it)));
  if (!it.windows.length && !it.details.length && !it.unavailable) {
    const exhausted = it.accounts.some(a => a.status === 'exhausted');
    kids.push(h('div', { class: 'note' }, exhausted ? 'Limit dolu olduğu için kota bilgisi alınamıyor.' : 'Kota bilgisi alınamadı ya da bu sağlayıcı kota penceresi sunmuyor.'));
  }
  // one row per credential (a credential is not an account: several can belong to the same account)
  it.accounts.forEach((a, i) => kids.push(h('div', { class: 'acct', style: i === 0 ? 'margin-top:10px' : '' },
    h('span', {}, a.label || a.source, h('span', { class: 'sub' }, ' · ' + CRED_KIND(a.source))),
    h('span', { style: 'display:flex;gap:10px;align-items:center' },
      a.verification === 'unverified' ? h('span', { class: 'chip', title: unverifiedWhy(a) }, 'hesabı doğrulanamadı') : null,
      statusEl(a.status || 'unknown')))));
  const unv = it.accounts.filter(a => a.verification === 'unverified');
  if (unv.length) kids.push(h('div', { class: 'note' }, `${unv.map(a => a.label || a.source).join(', ')}: hangi hesaba ait olduğu okunamadı; bu yüzden ayrı hesap sayılmadı.`));
  return h('div', { class: 'card' },
    h('div', { class: 'card-h' }, h('i', { style: `width:10px;height:10px;border-radius:3px;background:${pColor(it.provider)};display:inline-block` }),
      h('h3', {}, pName(it.provider)), h('span', { class: 'sub' }, [it.plan, it.account_key ? '1 hesap' : null, it.accounts.length + ' kimlik bilgisi'].filter(Boolean).join(' · '))), ...kids);
}

/** Called by renderers: fill a select with the values present in the current data. */
function fOptions(key, values, label = x => x) {
  const sel = $('f-' + key);
  const vals = [...new Set(values.filter(v => v != null && v !== ''))].sort((a, b) => String(label(a)).localeCompare(String(label(b)), 'tr'));
  if (flt[key] && !vals.includes(flt[key])) vals.unshift(flt[key]);
  const sig = vals.join('|');
  if (sel.dataset.sig === sig) return;
  sel.dataset.sig = sig;
  sel.replaceChildren(h('option', { value: '' }, F_ALL[key]), ...vals.map(v => h('option', { value: v }, label(v))));
  sel.value = flt[key] || '';
}
function fCount(shown, total, noun = 'sonuç') {
  $('f-count').textContent = shown === total ? `${total} ${noun}` : `${shown} / ${total} ${noun}`;
}
function syncFilters() {
  const keys = FILTERS[state.page] || [];
  $('filters').classList.toggle('show', keys.length > 0);
  ['q', 'source', 'provider', 'model', 'status'].forEach(k => {
    const el = $('f-' + k);
    (k === 'q' ? el.parentElement : el).style.display = keys.includes(k) ? '' : 'none';
    el.classList.toggle('active', !!flt[k] && keys.includes(k));

  $('f-clear').classList.toggle('show', keys.some(k => flt[k]));

function setFilter(k, v) {

}
function rerender() {

function buildFilters() {

  ['source', 'provider', 'model', 'status'].forEach(k => $('f-' + k).addEventListener('change', ev => setFilter(k, ev.target.value)));
  $('f-clear').addEventListener('click', () => { (FILTERS[state.page] || []).forEach(k => flt[k] = ''); store.set('filters', flt); syncFilters(); rerender(); });

function rangeDates() {
  const r = RANGES.find(x => x[0] === state.range);
  if (r && r[2] != null) { const to = new Date(); const from = new Date(); from.setDate(to.getDate() - r[2]); return [iso(from), iso(to)]; }
  return [state.from || iso(new Date(Date.now() - 6 * 864e5)), state.to || iso(new Date())];
}
const qs = () => { const [f, t] = rangeDates(); return `from=${f}&to=${t}` + (state.profile ? `&profile=${encodeURIComponent(state.profile)}` : ''); };

function buildChrome() {
  const nav = $('nav');
  PAGES.forEach(p => nav.append(h('a', { href: '#' + p.id, id: 'nav-' + p.id, onclick: ev => { ev.preventDefault(); go(p.id); } },

  addEventListener('hashchange', () => { const id = location.hash.slice(1); if (PAGES.some(p => p.id === id) && id !== state.page) go(id); });

function go(id) {

async function api(path, extra = '') {

}

  const m = d.running.filter(isOpenMain), n = k => m.filter(r => stateKey(r) === k).length;

// ---------- live (polls every 1.5 s) ----------

    const c = liveCounts(d), badge = $('badge-live');

  const quotaItems = (d.quotas.items || []).filter(it => it.windows.length || it.accounts.some(a => a.status === 'exhausted'));
  const quotaCardEl = card('Kotalar', d.quotas.fetched_at ? 'çekildi ' + ago(d.quotas.fetched_at) : '',
    h('div', { class: 'grid g3' }, quotaItems.map(it => quotaCard(it, d.burn))));

  // filters: source / status / search
  const liveSrc = r => r.source || 'hermes';
  fOptions('source', d.running.map(liveSrc), srcName);
  fOptions('status', ['working', 'needs_approval', 'waiting', 'stalled', 'ended'], STATUS_LABEL);
  const stOk = r => !fOn('status') || stateKey(r) === flt.status || (flt.status === 'running' && r.status === 'running') || (flt.status === 'done' && r.status !== 'running');
  const keep = r => fIs('source', liveSrc(r)) && stOk(r)
    && fMatch(r.title, r.profile, r.source_name, r.model, r.activity, r.parent_title, r.kanban && r.kanban.title);
  const allCount = d.running.length;
  // subagent tree: roots = running non-subagents; children grouped by parent
  const byParent = {};
  d.running.filter(r => r.subagent && keep(r)).forEach(r => (byParent[r.parent] ||= []).push(r));
  const roots = d.running.filter(r => !r.subagent && (keep(r) || byParent[r.id]));
  Object.keys(byParent).forEach(pid => { if (!roots.some(r => r.id === pid)) roots.push({ id: pid, orphan: true, title: byParent[pid][0].parent_title, profile: byParent[pid][0].profile, status: 'idle' }); });
  roots.sort(byAttention);
  if ((FILTERS.live || []).some(k => flt[k])) fCount(roots.filter(r => !r.orphan).length + Object.values(byParent).flat().length, allCount, 'oturum');
  const node = (r, child) => {
    const key = r.id, flash = prevTokens[key] != null && r.tokens > prevTokens[key];
    prevTokens[key] = r.tokens;
    const elapsed = r.started ? (r.status === 'running' ? d.now - r.started : (r.last || d.now) - r.started) : null;
    const k = stateKey(r), og = originName(r.origin);
    const meta = r.orphan ? h('div', { class: 'meta' }, 'ana oturum şu an boşta')
      : r.card_only ? h('div', { class: 'meta' }, h('span', {}, 'bu karta bağlı oturum bulunamadı'), h('span', {}, 'süre ', h('b', {}, dur(elapsed))))
      : h('div', { class: 'meta' },
          h('span', {}, h('b', { class: flash ? 'flash' : '' }, fmtN(r.tokens)), ' token'),
          h('span', {}, h('b', {}, fmtUsd(r.cost))),
          h('span', {}, h('b', {}, nfi.format(r.tools || 0)), r.source ? ' model çağrısı' : ' araç'),
          h('span', {}, 'süre ', h('b', {}, dur(elapsed))),
          h('span', {}, 'son ', ago(r.last)));
    const act = r.long_tool_call ? 'uzun araç çağrısı sürüyor: ' + r.long_tool_call : r.activity;
    const row = h('div', { class: 'orow' + (k === 'needs_approval' ? ' appr' : '') },
      h('div', { class: 'head' }, stateEl(r), h('span', { class: 'title' }, r.title || '(başlıksız oturum)'),
        h('span', { class: 'chip', style: r.source ? `color:${srcColor(r.source)};font-weight:600` : '' }, whoName(r)),
        og ? h('span', { class: 'chip' }, og) : null,
        r.kanban ? h('span', { class: 'chip', title: r.kanban.title }, 'kart ' + r.kanban.id) : null,
        r.model ? h('span', { class: 'chip' }, r.model) : null,
        r.account ? h('span', { class: 'chip', title: 'Bu oturumun kullandığı Claude hesabı (Hermes havuzundaki adı)' }, '@' + r.account) : null, openHint(r.open)),
      meta, act ? h('div', { class: 'act', title: act }, '↳ ' + act) : null);
    return h('div', { class: child ? 'child' : '' }, openable(row, r.open));
  };
  const tree = roots.length ? h('div', { class: 'tree' }, roots.map(r => h('div', { class: 'node root' + (stateKey(r) === 'needs_approval' ? ' appr' : '') }, node(r),
    byParent[r.id] ? h('div', { class: 'children' }, byParent[r.id].sort(byAttention).map(c => node(c, true))) : null)))
    : h('div', { class: 'empty' }, (FILTERS.live || []).some(k => flt[k]) ? 'Filtreye uyan oturum yok.' : T.noOpen);
  const treeCard = card('Açık oturumlar ve alt ajanlar', `${countLine(cnt)} · son 15 dk'da biten alt ajanlar dahil`, tree);
  const banner = approvals.length ? h('div', { class: 'banner', role: 'region', 'aria-label': T.approvalTitle(approvals.length) },
    h('h3', {}, T.approvalTitle(approvals.length), h('span', { class: 'sub', style: 'font-weight:400' }, ' — ' + T.approvalHint)),
    h('div', { class: 'jobs' }, approvals.map(jobRow))) : null;

  const byProf = card('Profil bazında tüketim', 'son 60 dk', hBars(d.by_profile.map(p => ({ label: p.profile, value: p.tokens, sub: fmtUsd(p.cost) }))));

  page.replaceChildren(h('div', { class: 'stack' }, banner, kpis, treeCard, h('div', { class: 'grid g2' }, tokCard, actCard), quotaCardEl, byProf));
}

// ---------- range pages ----------
async function loadPage() {
  const id = state.page;
  const page = $('p-' + id);
  page.classList.add('updating');
  try {
    const data = await api(id === 'overview' ? 'overview' : id);
    if (state.page !== id) return;
    lastData[id] = data;
    const [f, t] = rangeDates();
    $('meta').textContent = `${dayLabel(f)} – ${dayLabel(t)} · güncellendi ${new Date().toLocaleTimeString('tr-TR')}`;
    page.replaceChildren(RENDERERS[id](data));
  } catch (e) {
    page.replaceChildren(h('div', { class: 'card err' }, 'Veri alınamadı: ' + e.message));
  }
  page.classList.remove('updating');
}

function dailyUsageCard(u, metric = 'tokens') {
  const series = u.providers.map(p => ({ key: p, label: pName(p), color: pColor(p) }));
  const fmt = metric === 'cost' ? fmtUsd : fmtN;
  const cols = u.daily.map(d => ({ label: dayLabel(d.day), tipTitle: new Date(d.day + 'T00:00').toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' }),
    values: Object.fromEntries(Object.entries(d.by).map(([k, v]) => [k, v[metric]])) }));
  return card(metric === 'cost' ? 'Günlük API karşılığı (tahmini)' : 'Günlük token', 'sağlayıcıya göre', [legend(series), barChart(cols, series, { fmt })],
    { tableView: () => table([{ label: 'Gün', get: r => dayLabel(r.day) }, ...u.providers.map(p => ({ label: pName(p), n: 1, get: r => fmt(r.by[p]?.[metric]) }))], [...u.daily].reverse()) });

/** Narrow a usage payload to one provider (charts, tables and totals). */
function usageFor(u0) {
  fOptions('provider', u0.providers, pName);
  if (!fOn('provider')) return u0;
  const p = flt.provider, row = u0.by_provider.find(x => x.provider === p) || { tokens: 0, input: 0, output: 0, cache_read: 0, cost: 0, calls: 0, sessions: 0 };
  return {
    ...u0, providers: u0.providers.filter(x => x === p),
    daily: u0.daily.map(x => ({ ...x, by: x.by[p] ? { [p]: x.by[p] } : {} })),
    by_provider: u0.by_provider.filter(x => x.provider === p),
    by_model: u0.by_model.filter(x => x.provider === p),
    totals: { ...u0.totals, tokens: row.tokens, input: row.input, output: row.output, cache_read: row.cache_read, cost: row.cost, calls: row.calls, sessions: row.sessions },
    filtered: p,
  };
}

  fOptions('model', d0.sessions.map(x => x.model));
  fOptions('status', ['running', 'idle'], STATUS_LABEL);
  const keepS = x => fIs('source', x.source) && fIs('model', x.model) && fIs('status', x.running ? 'running' : 'idle')
    && fMatch(x.title, x.project, x.model, srcName(x.source));
  const d = { ...d0, sessions: d0.sessions.filter(keepS),
    sources: d0.sources.filter(x => fIs('source', x.source)),
    by_model: d0.by_model.filter(x => fIs('source', x.source) && fIs('model', x.model)),
    daily: d0.daily.map(x => ({ ...x, tokens: Object.fromEntries(Object.entries(x.tokens).filter(([k]) => fIs('source', k))),
                                      cost: Object.fromEntries(Object.entries(x.cost).filter(([k]) => fIs('source', k))) })) };
  // search / status narrow the session list: recompute the per-CLI cards from the matching sessions
  if (fOn('q') || fOn('status') || fOn('model')) {
    d.sources = d.sources.map(src => {
      const ss = d.sessions.filter(x => x.source === src.source);
      return { ...src, tokens: ss.reduce((a, x) => a + x.tokens, 0), cost: ss.reduce((a, x) => a + x.cost, 0),
               sessions: ss.filter(x => !x.subagent).length, subagents: ss.filter(x => x.subagent).length };
    }).filter(src => src.tokens || src.sessions);
  }
  fCount(d.sessions.filter(x => !x.subagent).length, d0.sessions.filter(x => !x.subagent).length, 'oturum');
  const kpis = h('div', { class: 'grid g-kpi' }, d.presence.map(p => {
    const src = d.sources.find(x => x.source === p.source);
    return h('div', { class: 'card kpi', style: `border-top:3px solid ${srcColor(p.source)}` },
      h('div', { class: 'label' }, p.name),
      h('div', { class: 'value' }, src ? fmtN(src.tokens) : '—'),
      h('div', { class: 'hint' }, src ? `${fmtUsd(src.cost)} · ${src.sessions} oturum · ${src.subagents} alt ajan`
        : p.tracked ? 'bu aralıkta kullanılmamış' : `izlenmiyor · son hareket ${ago(p.last_activity)}`));
  }));
  const series = d.sources.map(x => ({ key: x.source, label: x.name, color: srcColor(x.source) }));
  const cols = d.daily.map(x => ({ label: dayLabel(x.day), values: x.tokens }));
  const dayCard = card('Günlük token', 'CLI\'ya göre', [legend(series), barChart(cols, series)],
    { tableView: () => table([{ label: 'Gün', get: r => dayLabel(r.day) }, ...series.map(se => ({ label: se.label, n: 1, get: r => fmtN(r.tokens[se.key]) }))], [...d.daily].reverse()) });
  const costCols = d.daily.map(x => ({ label: dayLabel(x.day), values: x.cost }));
  const costCard = card('Günlük API karşılığı (tahmini)', 'tahmini API karşılığı', [legend(series), barChart(costCols, series, { fmt: fmtUsd })]);
  const models = card('Modeller', 'token', hBars(d.by_model.map(m => ({ label: m.model, value: m.tokens, sub: srcName(m.source) + ' · ' + fmtUsd(m.cost), color: srcColor(m.source) }))),
    { tableView: () => table([{ label: 'Model', get: r => r.model }, { label: 'CLI', get: r => srcName(r.source) }, { label: 'Token', n: 1, get: r => fmtN(r.tokens) }, { label: 'Çağrı', n: 1, get: r => fmtN(r.calls) }, { label: 'API karşılığı (tahmini)', n: 1, get: r => fmtUsd(r.cost) }], d.by_model) });
  const proj = {};
  d.sessions.forEach(x => { const k = (x.project || '—').replace(/^\/Users\/[^/]+/, '~'); (proj[k] ||= { tokens: 0, cost: 0 }); proj[k].tokens += x.tokens; proj[k].cost += x.cost; });
  const projCard = card('Projeler', 'token', hBars(Object.entries(proj).map(([k, v]) => ({ label: k, value: v.tokens, sub: fmtUsd(v.cost) }))));
  const byParent = {};
  d.sessions.filter(x => x.subagent).forEach(x => (byParent[x.parent] ||= []).push(x));
  const mains = d.sessions.filter(x => !x.subagent);
  const tbl = card('Oturumlar', `${mains.length} oturum · ${d.sessions.length - mains.length} alt ajan`, table([
    { label: 'Durum', get: r => statusEl(r.running ? 'running' : 'idle') },
    { label: 'CLI', get: r => h('span', { style: `color:${srcColor(r.source)};font-weight:600` }, srcName(r.source)) },
    { label: 'Oturum', get: r => h('div', { style: 'max-width:380px' }, r.title || '(başlıksız)', h('div', { class: 'sub', style: 'font-size:11.5px' },
        [(r.project || '').replace(/^\/Users\/[^/]+/, '~'), byParent[r.id] ? `${byParent[r.id].length} alt ajan` : null].filter(Boolean).join(' · '))) },
    { label: 'Model', get: r => r.model || '—' },
    { label: 'Token', n: 1, get: r => fmtN(r.tokens + (byParent[r.id] || []).reduce((a, x) => a + x.tokens, 0)) },
    { label: 'Önbellek', n: 1, get: r => fmtN(r.cache_read) },
    { label: 'Çağrı', n: 1, get: r => nfi.format(r.calls) },
    { label: 'API karşılığı (tahmini)', n: 1, get: r => fmtUsd(r.cost + (byParent[r.id] || []).reduce((a, x) => a + x.cost, 0)) },
    { label: 'Son', get: r => ago(r.last) },
  ], mains));
  const note = h('div', { class: 'note' }, 'Claude Code oturumları da bir Anthropic kotasından yer; hangi hesaba bağlı olduğu ve kota durumu "Hesaplar & Kotalar" sayfasında (Claude Code girişi tek hesap olarak görünür). Token = girdi + çıktı (önbellekten okunan ayrı gösterilir). Gemini / Antigravity ve Factory Droid kullanım kaydı tutmadığı için sadece son hareket gösterilir.');
  return h('div', { class: 'stack' }, kpis, h('div', { class: 'grid g2' }, dayCard, costCard), h('div', { class: 'grid g2' }, models, projCard), tbl, note);
}

const KORDER = ['running', 'review', 'blocked', 'ready', 'scheduled', 'todo', 'triage', 'done'];
const blockedHint = b => b.blocked_by_kind ? `${b.blocked_by_kind.needs_input || 0} girdi bekliyor · ${b.blocked_by_kind.other || 0} diğer` : null;
function renderKanban(d) {
  if (!d.boards.length) return h('div', { class: 'card empty' }, 'Kart yok.');
  return h('div', { class: 'stack' }, d.boards.map(b => {
    const assignees = b.by_assignee.filter(a => !state.profile || a.assignee === state.profile);
    const scoped = b.cards.filter(c => !state.profile || c.assignee === state.profile);
    fOptions('status', scoped.map(c => c.status), STATUS_LABEL);
    const cards = scoped.filter(c => fIs('status', c.status) && fMatch(c.title, c.assignee, c.last_failure_error));
    fCount(cards.length, scoped.length, 'kart');
    const doneInRange = b.done_daily.reduce((a, x) => a + x.done, 0);
    const kpis = h('div', { class: 'grid g-kpi' },
      KORDER.filter(x => x !== 'done' && b.counts[x] != null).map(x => kpi(STATUS_LABEL(x), nfi.format(b.counts[x]), x === 'blocked' ? blockedHint(b) : null)),
      kpi('Bu aralıkta biten', nfi.format(doneInRange)), kpi('Toplam', nfi.format(Object.values(b.counts).reduce((a, x) => a + x, 0)), `${b.counts.archived || 0} arşivde`));
    const doneCard = card('Günlük biten kart', '', barChart(b.done_daily.map(x => ({ label: dayLabel(x.day), values: { v: x.done } })), [{ key: 'v', label: 'Biten', color: 'var(--s3)' }], { height: 150, fmt: v => nfi.format(Math.round(v)) }));
    const aSeries = [{ key: 'done', label: 'Biten (aralıkta)', color: 'var(--s1)' }, { key: 'running', label: 'Çalışan', color: 'var(--s2)' }, { key: 'blocked', label: 'Bloklu', color: 'var(--s4)' }];
    const aCard = card('Atanan profile göre kartlar', '', table([{ label: 'Profil', get: r => r.assignee }, ...aSeries.map(se => ({ label: se.label, n: 1, get: r => nfi.format(r[se.key] || 0) })),
      { label: 'Diğer', n: 1, get: r => nfi.format(Object.entries(r).filter(([k]) => !['assignee', 'done', 'running', 'blocked'].includes(k)).reduce((a, [, v]) => a + v, 0)) }], assignees));
    const statuses = [...new Set([...KORDER.filter(x => cards.some(c => c.status === x)), ...cards.map(c => c.status)])];
    const cols = h('div', { class: 'cols' }, statuses.map(st => {
      const cs = cards.filter(c => c.status === st);
      return h('div', { class: 'col' }, h('h4', {}, statusEl(st), h('span', { class: 'sub' }, st === 'done' ? `${cs.length} (aralıkta)` : String(b.counts[st] ?? cs.length))),
        cs.slice(0, st === 'done' ? 12 : 40).map(c => openable(h('div', { class: 'kcard' }, c.title,
          h('div', { class: 'sub' }, `${c.assignee || 'atanmamış'} · ${ago(c.completed_at || c.last_heartbeat_at || c.started_at || c.created_at)}`),
          c.block_kind === 'needs_input' || c.status === 'review' || canOpen(c.open) ? h('div', { class: 'chips' },
            c.block_kind === 'needs_input' ? h('span', { class: 'chip' }, 'girdi bekliyor') : null,
            c.status === 'review' ? h('span', { class: 'chip' }, 'inceleme bekliyor') : null, openHint(c.open)) : null,
          c.consecutive_failures ? h('div', { class: 'err' }, `${c.consecutive_failures} hata: ${(c.last_failure_error || '').slice(0, 120)}`) : null), c.open)));
    }));
    return h('div', { class: 'stack' }, kpis, h('div', { class: 'grid g2' }, doneCard, aCard), card('Pano · ' + b.board, '', cols));
  }));
}

// ---------- boot ----------
const RENDERERS = { overview: renderOverview, accounts: renderAccounts, agents: renderAgents, subagents: renderSubagents, clis: renderClis, kanban: renderKanban };
buildChrome();
buildFilters();
const hashPage = location.hash.slice(1);
go(PAGES.some(p => p.id === hashPage) ? hashPage : PAGES.some(p => p.id === state.page) ? state.page : 'live');
if (state.page !== 'live') loadLive();
</script>
</body>
